name: Publish articles

on:
  push:
    branches:
      - main
  workflow_dispatch:

# zenn-qiita-sync が変換結果を main へ commit / push するため contents: write が必要
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check for published article changes
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ -z "$BEFORE" ]] || [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep "^articles/.*\.md$" || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" | grep "^articles/.*\.md$" || true)
          fi

          HAS_PUBLISHED=false
          while IFS= read -r file; do
            if [[ -n "$file" ]] && grep -q "published: true" "$file" 2>/dev/null; then
              HAS_PUBLISHED=true
              break
            fi
          done <<< "$CHANGED"
          echo "has_published=$HAS_PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Run
        if: steps.check.outputs.has_published == 'true'
        # サードパーティ Action のためコミット SHA で固定（main ブランチ 2026-11-13 時点の HEAD）
        uses: C-Naoki/zenn-qiita-sync@af751d37a2c96c60fc23d07e5d785a670ea8705a # main
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
