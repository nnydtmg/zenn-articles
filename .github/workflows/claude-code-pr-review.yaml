name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# 既定はすべて無効。必要な権限はジョブ単位で付与する
permissions: {}

jobs:
  claude:
    # 公開リポジトリのため、@claude を含むだけでなく投稿者がリポジトリの
    # OWNER / MEMBER / COLLABORATOR であることも条件にする
    # （claude-code-action 側の書き込み権限チェックに加えた多層防御）
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # 既定の GitHub App 認証（Claude GitHub App のトークン取得）に GitHub OIDC トークンが必要。
      # API キー認証でも、github_token 入力を渡さない限り必須（claude-code-action docs/faq.md, docs/setup.md）
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # 記事レビュー用途に限定する:
          # - acceptEdits: ワークスペース内のファイル編集のみ許可し、許可リスト外のツールは拒否
          #   （既定の auto モードでは許可リスト外の Bash も安全性レビューを通れば実行される）
          # - Bash は読み取り系の git コマンドのみ。任意コマンド・npm/npx の実行は許可しない
          #   （commit/push はアクションが内部で許可する専用ラッパー経由。push 先は作業ブランチに固定される）
          # - WebSearch / WebFetch はファクトチェック（.claude/skills/fact-check.md）用
          claude_args: |
            --permission-mode acceptEdits
            --allowedTools "Read,Grep,Glob,LS,Edit,MultiEdit,WebSearch,WebFetch,Bash(git status),Bash(git diff:*),Bash(git log:*)"
